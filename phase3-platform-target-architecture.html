<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Phase3 platform · target architecture</title>
<style>
:root{--Measure:#1f6fb8;--Measurebg:#e3eefa;--Manage:#1f8a4c;--Managebg:#e6f4ec;--Reason:#6455e0;--Reasonbg:#ecebfc;--Clients:#a0522d;--Clientsbg:#f8ece4;--Foundation:#5f6b7a;--Foundationbg:#eceef1;--bg:#f5f4f0;--panel:#fff;--panel2:#f8f7f3;--line:#e2e0d8;--line2:#cfccc2;--text:#1d1e22;--text2:#4b4a52;--muted:#7a7982;--accent:#6455e0;
--impl:#1f8a4c;--part:#b07d00;--plan:#8a8994;--sim:#1f6fb8;--implbg:#e6f4ec;--partbg:#fcf3dc;--planbg:#efeef2;--simbg:#e3eefa;color-scheme:light}
[data-theme=dark]{--Measure:#7cb8f2;--Measurebg:#1c2c3d;--Manage:#6fcf97;--Managebg:#1f3328;--Reason:#b6acf2;--Reasonbg:#2a2745;--Clients:#e8a77f;--Clientsbg:#3a2a20;--Foundation:#a9b4c2;--Foundationbg:#2a2e34;--bg:#17181c;--panel:#202126;--panel2:#26272d;--line:#33343b;--line2:#45464e;--text:#ecebe8;--text2:#b8b7b2;--muted:#8d8c95;--accent:#b6acf2;
--impl:#6fcf97;--part:#f2c94c;--plan:#9a99a3;--sim:#7cb8f2;--implbg:#1f3328;--partbg:#3a321a;--planbg:#2b2b31;--simbg:#1c2c3d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.13em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;color:var(--text2);font-size:13.5px;font-weight:550}
nav.tabs button:hover{background:var(--panel2)}nav.tabs button.on{background:var(--text);color:var(--bg)}
.sp{flex:1}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:550;color:var(--text)}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}[data-theme=dark] .btn.pri{color:#17171b}
.btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
main{padding:16px 22px 120px;max-width:1560px;margin:0 auto}
.lede{color:var(--text2);max-width:980px;margin:2px 0 14px;font-size:14.5px}
.note{font-size:12px;color:var(--muted)}
.st{display:inline-block;font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.st.L{border:1px solid currentColor}.st.Implemented{color:var(--impl);background:var(--implbg)}.st.Partial{color:var(--part);background:var(--partbg)}.st.Planned{color:var(--plan);background:var(--planbg);border-style:dashed}.st.Simulated-demo{color:var(--sim);background:var(--simbg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 8px;font-size:14.5px;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
svg#map{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px}
svg text{font-family:inherit}
.zone{fill:var(--panel2)}.zt{fill:var(--muted);font-size:10.5px;letter-spacing:.1em;font-weight:650}
.node rect{stroke-width:1.4;rx:9;cursor:pointer;transition:opacity .25s}
.node .nn{font-size:12px;font-weight:650;fill:var(--text);pointer-events:none}.node .ns{font-size:10px;fill:var(--muted);pointer-events:none}
.node.dim{opacity:.22}.node.hot rect{stroke-width:2.6;filter:drop-shadow(0 2px 6px rgba(100,85,224,.35))}.node.sel rect{stroke:var(--accent)!important;stroke-width:2.8}
.edge{fill:none;stroke:var(--line2);stroke-width:1.1;opacity:.55;transition:opacity .25s}
.edge.on{stroke-width:2.6;opacity:1}.edge.dim{opacity:.08}.edge.planned{stroke-dasharray:6 5}
.tlabel{font-size:9.5px;font-weight:600}
.tbadge{rx:5}
.panel{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.hop{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hop .n{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel2);color:var(--text2);border:1px solid var(--line2)}
.hop.cur .n{background:var(--accent);color:#fff;border-color:var(--accent)}.hop.done .n{background:var(--text);color:var(--bg);border-color:var(--text)}
.hop b{font-size:13px}.hop .d{font-size:12.5px;color:var(--text2)}.hop .bd{font-size:11.8px;color:var(--part);margin-top:2px}
.hop:not(.cur):not(.done) .d,.hop:not(.cur):not(.done) .bd{display:none}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
.bound{border-left:3px solid var(--part);background:var(--partbg);padding:8px 11px;border-radius:0 9px 9px 0;font-size:12.8px;margin-top:10px}
.okb{border-left:3px solid var(--impl);background:var(--implbg);padding:8px 11px;border-radius:0 9px 9px 0;font-size:12.8px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.bars{display:flex;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bars span{display:block;height:100%}
.states{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.state{padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px;font-weight:600}
.arr{color:var(--muted)}
.funnel div{margin:4px 0;padding:7px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.scen{cursor:pointer}.scen.on{outline:2px solid var(--accent)}
.tour{position:fixed;left:16px;right:16px;bottom:14px;z-index:30;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.18);display:none}
.tour .pg{height:3px;background:var(--line);border-radius:14px 14px 0 0;overflow:hidden}.tour .pg span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tour .row{display:flex;gap:14px;align-items:flex-start;padding:11px 16px}
.tour .tx{flex:1;min-width:0}.tour .tn{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.tour .tt{font-weight:650;font-size:15px}.tour .tb{font-size:13px;color:var(--text2)}
@media (max-width:1100px){.mapwrap{grid-template-columns:1fr}.panel{position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><g fill="var(--accent)"><rect x="6" y="6" width="4" height="13"/><rect x="14" y="10" width="4" height="13"/><rect x="22" y="14" width="4" height="13"/></g></svg>
    <div><b>Phase3 platform</b><small>TARGET ARCHITECTURE</small></div></div>
  <nav class="tabs" id="tabs"></nav>
  <span class="sp"></span>
  <button class="btn pri" id="tourBtn">▶ Guided tour</button>
  <button class="btn" id="themeBtn" title="Light or dark">◐</button>
</header>
<main id="main"></main>
<div class="tour" id="tour"><div class="pg"><span></span></div><div class="row"><div class="tx"><div class="tn" id="tN"></div><div class="tt" id="tT"></div><div class="tb" id="tB"></div></div>
<div class="row" style="padding:0;gap:6px;align-items:center"><select id="vSel" style="max-width:150px"></select><button class="btn" id="tV">🔊</button><button class="btn" id="tP">←</button><button class="btn pri" id="tPl">❚❚</button><button class="btn" id="tN2">→</button><button class="btn" id="tX">✕</button></div></div></div>

const NW = 186, NH = 40, Y0 = 46, RS = 54;

const W = 1300, BAND = Y0 + 11.05 * RS, H = Y0 + 12.55 * RS;
function edgePath(a, b) {
  const A = pos(N[a]), B = pos(N[b]);
  if (a === b) { const x = A.x + NW, y = A.y + NH / 2; return `M${x},${y - 8} C${x + 46},${y - 34} ${x + 46},${y + 34} ${x},${y + 8}`; }
  let x1, y1, x2, y2;
  if (N[a].c === N[b].c) { x1 = A.x + NW; y1 = A.y + NH / 2; x2 = B.x + NW; y2 = B.y + NH / 2; const k = 40 + Math.abs(y2 - y1) * .15; return `M${x1},${y1} C${x1 + k},${y1} ${x2 + k},${y2} ${x2},${y2}`; }
  const fwd = B.x > A.x; x1 = fwd ? A.x + NW : A.x; y1 = A.y + NH / 2; x2 = fwd ? B.x : B.x + NW; y2 = B.y + NH / 2;
  const dx = Math.max(40, Math.abs(x2 - x1) * .45) * (fwd ? 1 : -1);
  return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
}
const EDGES = (() => { const m = new Map(); D.FLOWS.forEach(f => f.hops.forEach(h => { if (h[0] !== h[1]) m.set(h[0] + '>' + h[1], 1); })); D.TRUST.forEach(t => m.set(t[0] + '>' + t[1], 1)); return m; })();

function mapSvg() {

  g += `<rect class="zone" x="16" y="${BAND}" width="${D.COLS[5].x + NW + 12 - 16}" height="${H - BAND - 8}" rx="12" style="fill:none;stroke:var(--line2);stroke-dasharray:4 4"/><text class="zt" x="30" y="${BAND + 20}">FOUNDATION</text><text class="ns" x="30" y="${BAND + 34}" style="fill:var(--muted);font-size:9.5px">identity · keys · monitoring</text>`;
  if (N.gm && N.vo) { const a = pos(N.gm), b = pos(N.vo); g += `<rect x="${a.x - 6}" y="${a.y - 14}" width="${NW + 12}" height="${b.y + NH - a.y + 20}" rx="11" fill="none" stroke="var(--Measure)" stroke-dasharray="5 4"/><text x="${a.x + 2}" y="${a.y - 4}" style="fill:var(--Measure);font-size:9.5px;font-weight:700">PHASE3 DEVICE FAMILY</text>`; }
  { const a = pos(N.spa), b = pos(N.portal); g += `<rect x="${a.x - 6}" y="${a.y - 16}" width="${NW + 12}" height="${b.y + NH - a.y + 22}" rx="11" fill="none" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${a.x + 2}" y="${a.y - 5}" style="fill:var(--accent);font-size:9.5px;font-weight:700">ONE CLIENT OF THE PLATFORM</text>`; }
  g += '<g id="edges">';
  EDGES.forEach((st, k) => { const [a, b] = k.split('>'); g += `<path class="edge" data-e="${k}" d="${edgePath(a, b)}"/>`; });
  g += '</g><g id="nodes">';
  D.NODES.forEach(n => { const p = pos(n); g += `<g class="node" data-n="${n.id}" transform="translate(${p.x},${p.y})"><rect width="${NW}" height="${NH}" fill="${bgVar(n.layer)}" stroke="${colVar(n.layer)}"/>
    <text class="nn" x="10" y="17">${esc(n.n)}</text><text class="ns" x="10" y="31">${esc(n.s)}</text><circle cx="${NW - 11}" cy="11" r="4" fill="${colVar(n.layer)}"/></g>`; });
  g += '</g><g id="lens"></g><g id="pk"></g>';
  return `<svg id="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Platform architecture">${g}</svg>`;
}

/* ── Alerting: contacts, teams, silences, flood control + storm simulator ── */
V.alert = el => {
  const SITES = { North: ['Northfield', 'Riverside', 'Westhaven', 'Hillcrest', 'Eastbrook'], South: ['Harbour View', 'Meadowbank', 'Parkside', 'Southgate', 'Central Square'] };
  const regionOf = site => SITES.North.includes(site) ? 'North' : 'South';
  const SEVS = ['Critical', 'Major', 'Minor'];
  const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  if (!S.al) S.al = {
    teams: [
      { id: 'cr', n: 'Control Room', hours: '24/7', from: 0, to: 1440, region: 'All', rules: { Critical: 'now', Major: 'now', Minor: 'off' }, ch: { Critical: ['SMS', 'Email'], Major: ['Email'], Minor: ['Email'] },
        contacts: [{ n: 'A. Byrne', sms: true, email: true }, { n: 'C. Walsh', sms: true, email: true }, { n: 'R. Patel', sms: false, email: true }] },
      { id: 'fn', n: 'LV Field · North', hours: '07:00–19:00 + on-call', from: 420, to: 1140, oncall: 'S. Murphy', region: 'North', rules: { Critical: 'now', Major: 'now', Minor: 'off' }, ch: { Critical: ['SMS'], Major: ['SMS'], Minor: ['Email'] },
        contacts: [{ n: 'S. Murphy', sms: true, email: true }, { n: 'D. Kelly', sms: true, email: false }, { n: 'J. Hughes', sms: true, email: true }, { n: 'M. Okafor', sms: true, email: false }] },
      { id: 'fs', n: 'LV Field · South', hours: '07:00–19:00 + on-call', from: 420, to: 1140, oncall: 'L. Grant', region: 'South', rules: { Critical: 'now', Major: 'now', Minor: 'off' }, ch: { Critical: ['SMS'], Major: ['SMS'], Minor: ['Email'] },
        contacts: [{ n: 'L. Grant', sms: true, email: true }, { n: 'P. Shah', sms: true, email: false }, { n: 'E. Reid', sms: true, email: true }] },
      { id: 'am', n: 'Asset Management', hours: '08:00–17:00', from: 480, to: 1020, region: 'All', rules: { Critical: 'off', Major: 'now', Minor: 'digest' }, ch: { Critical: ['Email'], Major: ['Email'], Minor: ['Email'] },
        contacts: [{ n: 'K. Brennan', sms: false, email: true }, { n: 'T. Clarke', sms: false, email: true }] },
      { id: 'np', n: 'Network Planning', hours: 'Daily digest 07:00', from: 480, to: 1020, region: 'All', rules: { Critical: 'digest', Major: 'digest', Minor: 'digest' }, ch: { Critical: ['Email'], Major: ['Email'], Minor: ['Email'] },
        contacts: [{ n: 'N. Fraser', sms: false, email: true }, { n: 'H. Chen', sms: false, email: true }] },
    ],
    silences: [
      { on: true, kind: 'Planned outage (from outage feed)', scope: 'Meadowbank', from: 900, to: 1020, max: 'Critical', note: 'Expected loss of mains during planned work; device kept alive, snapshot on return' },
      { on: true, kind: 'Storm mode · North', scope: 'North', from: 840, to: 1200, max: 'Minor', note: 'Minor alarms go to the digest while the storm is on' },
      { on: false, kind: 'Device under maintenance', scope: 'Eastbrook', from: 780, to: 1080, max: 'Major', note: 'Manual silence by A. Byrne, reason: modem swap' },
    ],
    fc: { dedupe: true, dedupeMin: 15, group: true, groupMin: 60, rate: true, rateN: 4, quiet: true, escalate: true, escMin: 10 },
    team: 'cr', sel: null,
  };
  const C = S.al;

  /* deterministic storm: wind storm on the North 14:00–20:00, background all day */
  const rnd = (() => { let x = 20261110; return () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648; })();
  const EV = [];
  const add = (t, site, dev, code, sev, inc, cust) => EV.push({ t: Math.round(t), site, region: regionOf(site), dev, code, sev, inc, cust });
  let incN = 400;
  // background minor events 06:00–22:00
  for (let t = 360; t < 1320; t += 9 + rnd() * 14) { const r = rnd() < .5 ? 'North' : 'South', s = SITES[r][Math.floor(rnd() * 5)]; add(t, s, `${s.slice(0, 3).toUpperCase()}-${10 + Math.floor(rnd() * 8)}`, rnd() < .6 ? 'Undervoltage blip' : 'Comms loss', 'Minor', null, 0); }
  // storm faults on the North
  const stormFaults = [[842, 'Northfield', 'F03', 214], [868, 'Riverside', 'F01', 156], [905, 'Westhaven', 'F05', 98], [951, 'Northfield', 'F06', 187], [1003, 'Hillcrest', 'F02', 260], [1047, 'Riverside', 'F04', 132], [1092, 'Westhaven', 'F02', 75], [1131, 'Eastbrook', 'F01', 120], [1166, 'Northfield', 'F03', 214]];
  stormFaults.forEach(([t, s, f, cust]) => {
    const inc = 'INC-' + (++incN), pre = s.slice(0, 3).toUpperCase();
    add(t, s, `${pre}-EFI${f}a`, 'Fault passage (forward)', 'Major', inc, 0); add(t + .2, s, `${pre}-EFI${f}b`, 'Fault passage (reverse)', 'Major', inc, 0);
    const n = 3 + Math.floor(rnd() * 5);
    for (let k = 0; k < n; k++) { const d = `${pre}-${f}-${k + 1}`; add(t + .5 + k * .2, s, d, 'Loss of mains', 'Critical', inc, Math.round(cust / n));
      for (let a = 1; a <= 2 + Math.floor(rnd() * 3); a++) { add(t + a * (1 + rnd() * 2), s, d, 'Mains returned', 'Minor', inc, 0); add(t + a * (1 + rnd() * 2) + .5, s, d, 'Loss of mains', 'Critical', inc, Math.round(cust / n)); } // auto-reclose flapping
      if (rnd() < .5) add(t + 40 + rnd() * 30, s, d, 'Mains returned', 'Minor', inc, 0); }
    for (let k = 0; k < 6; k++) add(t + 2 + rnd() * 25, s, `${pre}-${10 + k}`, 'Undervoltage', 'Minor', inc, 0);
  });
  // planned outage at Meadowbank 15:00–17:00 (expected loss of mains)
  ['MEA-F02-1', 'MEA-F02-2', 'MEA-F02-3'].forEach((d, k) => { add(902 + k, 'Meadowbank', d, 'Loss of mains', 'Critical', 'INC-PLN', 90); add(1012 + k, 'Meadowbank', d, 'Mains returned', 'Minor', 'INC-PLN', 0); });
  // a real fault in the South, mid-evening
  const parInc = 'INC-' + (++incN + 50);
  ['PAR-F01-1', 'PAR-F01-2', 'PAR-F01-3', 'PAR-F01-4'].forEach((d, k) => add(1194 + k * .3, 'Parkside', d, 'Loss of mains', 'Critical', parInc, 54));
  add(1194, 'Parkside', 'PAR-EFIF01', 'Fault passage (forward)', 'Major', parInc, 0);
  EV.sort((a, b) => a.t - b.t);

  const onDuty = (tm, t) => tm.from === 0 || (t >= tm.from && t < tm.to) || !!tm.oncall;
  const dutyPeople = (tm, t) => (tm.from === 0 || (t >= tm.from && t < tm.to)) ? tm.contacts : tm.contacts.filter(c => c.n === tm.oncall);
  const deliver = (people, ch, all) => { let sms = 0, email = 0; people.forEach(c => { if (all) { sms++; email++; return; } const want = ch.filter(x => (x === 'SMS' && c.sms) || (x === 'Email' && c.email)); if (!want.length) email++; else want.forEach(x => x === 'SMS' ? sms++ : email++); }); return { sms, email }; };
  const silencedBy = e => C.silences.find(s => s.on && e.t >= s.from && e.t < s.to && (s.scope === e.site || s.scope === e.region || s.scope === e.dev) && SEVS.indexOf(e.sev) >= SEVS.indexOf(s.max));

  function simulate(useControls) {
    const out = Object.fromEntries(C.teams.map(t => [t.id, []]));
    const lastSeen = {}, incSent = {}, incSev = {}, bucket = {}, pendingSummary = {};
    let suppressed = { silence: 0, dedupe: 0, group: 0, rate: 0, digest: 0 }, critMissed = 0;
    const critIncs = new Set(), critCovered = new Set();
    EV.forEach(e => {
      if (e.sev === 'Critical' && e.inc && e.inc !== 'INC-PLN') critIncs.add(e.inc);
      if (useControls) {
        const sil = silencedBy(e); if (sil) { suppressed.silence++; return; }
        const k = e.dev + '|' + e.code; if (C.fc.dedupe && lastSeen[k] != null && e.t - lastSeen[k] < C.fc.dedupeMin) { suppressed.dedupe++; lastSeen[k] = e.t; return; } lastSeen[k] = e.t;
      }
      C.teams.forEach(tm => {
        if (tm.region !== 'All' && tm.region !== e.region) return;
        let mode = tm.rules[e.sev]; if (mode === 'off') return;
        if (!useControls) mode = 'now';
        if (mode === 'digest') { suppressed.digest++; out[tm.id].push({ t: e.t, kind: 'digest', e }); return; }
        if (useControls && C.fc.quiet && e.sev === 'Minor' && (e.t < 420 || e.t >= 1320)) { suppressed.digest++; out[tm.id].push({ t: e.t, kind: 'digest', e }); return; }
        const people = dutyPeople(tm, e.t); if (!people.length) return;
        if (useControls && C.fc.group && e.inc) {
          const ik = tm.id + e.inc, prev = incSent[ik];
          if (prev != null && e.t - prev < C.fc.groupMin) {
            const worse = SEVS.indexOf(e.sev) < SEVS.indexOf(incSev[ik]);
            if (!worse) { suppressed.group++; const last = out[tm.id].filter(x => x.inc === e.inc && x.kind !== 'digest').pop(); if (last) { last.count = (last.count || 1) + 1; last.cust = (last.cust || 0) + e.cust; } return; }
          }
          incSent[ik] = e.t; incSev[ik] = e.sev;
        }
        if (useControls && C.fc.rate && e.sev !== 'Critical') {
          const b = tm.id + Math.floor(e.t / 15); bucket[b] = (bucket[b] || 0) + 1;
          if (bucket[b] > C.fc.rateN) { suppressed.rate++; pendingSummary[b] = (pendingSummary[b] || 0) + 1; return; }
        }
        const ch = useControls ? tm.ch[e.sev] : ['SMS', 'Email'], d = deliver(useControls ? people : tm.contacts, ch, !useControls);
        out[tm.id].push({ t: e.t, kind: 'now', e, inc: e.inc, ch, people: people.length, sms: d.sms, email: d.email, msgs: d.sms + d.email, count: 1, cust: e.cust });
        if (tm.id === 'cr' && e.sev === 'Critical' && e.inc) critCovered.add(e.inc);
      });
    });
    if (useControls) Object.entries(pendingSummary).forEach(([b, n]) => { const id = b.replace(/\d+$/, ''), slot = +b.slice(id.length); const tm = C.teams.find(t => t.id === id);
      const pp = dutyPeople(tm, slot * 15 + 15); out[id].push({ t: slot * 15 + 15, kind: 'summary', n, ch: ['Email'], people: pp.length, sms: 0, email: pp.length, msgs: pp.length }); });
    Object.values(out).forEach(a => a.sort((x, y) => x.t - y.t));
    critIncs.forEach(i => { if (!critCovered.has(i)) critMissed++; });
    const msgs = Object.values(out).flat().filter(x => x.kind !== 'digest').reduce((s, x) => s + (x.msgs || 0), 0);
    const all = Object.values(out).flat().filter(x => x.kind !== 'digest');
    return { out, msgs, sms: all.reduce((s, x) => s + (x.sms || 0), 0), email: all.reduce((s, x) => s + (x.email || 0), 0), suppressed, critIncs: critIncs.size, critMissed };
  }

  function chart(base, ctl) {
    const B = 40, t0 = 600, bw = 15, W = 860, H = 170, P = 30, n = (1320 - t0) / bw;
    const cnt = (sim, i) => Object.values(sim.out).flat().filter(x => x.kind !== 'digest' && x.t >= t0 + i * bw && x.t < t0 + (i + 1) * bw).reduce((s, x) => s + (x.msgs || 0), 0);

    const A = [...Array(n)].map((_, i) => [raw(i), cnt(base, i), cnt(ctl, i)]), mx = Math.max(...A.map(a => Math.max(a[1], a[0]))) || 1;
    const x = i => P + i * (W - P) / n, y = v => H - 18 - v / mx * (H - 30), bwpx = (W - P) / n;
    let g = `<line x1="${P}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line2)"/>`;
    for (let h = 10; h <= 22; h += 2) g += `<text x="${x((h * 60 - t0) / bw)}" y="${H - 4}" font-size="10" fill="var(--muted)">${h}:00</text>`;
    g += `<rect x="${x((840 - t0) / bw)}" y="4" width="${x((1200 - t0) / bw) - x((840 - t0) / bw)}" height="${H - 22}" fill="var(--Clientsbg)" opacity=".5"/><text x="${x((840 - t0) / bw) + 4}" y="15" font-size="10" fill="var(--Clients)" font-weight="700">storm</text>`;
    A.forEach((a, i) => { g += `<rect x="${x(i) + 1}" y="${y(a[1])}" width="${bwpx * .45}" height="${H - 18 - y(a[1])}" fill="var(--line2)"><title>${fmt(t0 + i * bw)} · without controls: ${a[1]} messages</title></rect>`;

  }

  function render() {

    el.innerHTML = `<p class="lede">Contacts and teams choose what they receive and whether by SMS or email. Time-based silences and flood controls stop an alarm storm turning into hundreds of messages, while every critical incident still reaches the control room. Change any setting and the storm below re-runs.</p>
    <div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px">

      <div class="card"><div class="note">Messages without controls</div><div style="font-size:26px;font-weight:700;color:var(--muted)">${base.msgs.toLocaleString('en-GB')}</div><div class="note">every alarm to every contact by SMS and email (${base.sms.toLocaleString('en-GB')} SMS)</div></div>

    <div class="card" style="margin-bottom:14px"><h3>Storm day: messages every 15 minutes</h3>${chart(base, ctl)}
      <div class="note" style="margin-top:6px">Held back by: silences ${ctl.suppressed.silence} · duplicates ${ctl.suppressed.dedupe} · grouped into incidents ${ctl.suppressed.group} · rate-limited into summaries ${ctl.suppressed.rate} · sent to digests ${ctl.suppressed.digest}</div></div>
    <div class="grid" style="grid-template-columns:1.15fr 1fr;align-items:start">
     <div class="grid">

     <div class="grid">

/* ── tour ───────────────────────────────────── */
const synth = window.speechSynthesis; let ti = -1, tPlaying = false, tTimer = null, voice = null, voices = [], voiceOn = true, token = null;
try { voiceOn = localStorage.getItem('p3a.voice') !== 'off'; } catch (e) { }
const SPOKEN = [[/Phase3/g, 'Phase Three'], [/\bSQL\b/g, 'sequel'], [/\bIoT\b/g, 'I o T'], [/\bSMS\b/g, 'S M S'], [/\bAPIs\b/g, 'A P Is'], [/\bSignalR\b/g, 'Signal R'], [/\bOTA\b/g, 'O T A']];
const vs = v => (/(Serena|Daniel|Kate|Google UK English|Sonia|Ryan|Libby|George|Hazel)/.test(v.name) ? 60 : 0) + (/Natural|Neural|Online|Premium|Enhanced/.test(v.name) ? 30 : 0) + (/en-GB/i.test(v.lang) ? 25 : /en-IE/i.test(v.lang) ? 20 : 5);
function pickV() { if (!synth) return; voices = synth.getVoices().filter(v => /^en/i.test(v.lang)).sort((a, b) => vs(b) - vs(a)); voice = voices[0] || null; $('#vSel').innerHTML = voices.slice(0, 12).map(v => `<option>${esc(v.name)}</option>`).join(''); $('#vSel').style.display = voices.length && voiceOn ? '' : 'none'; }
if (synth) { pickV(); synth.onvoiceschanged = pickV; }
$('#vSel').onchange = e => { voice = voices.find(v => v.name === e.target.value) || voice; };
function speak(t, done) {
  if (!synth || !voiceOn) return false; synth.cancel(); const my = {}; token = my;
  const parts = [], ss = (t.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [t]).map(x => x.trim()).filter(Boolean);
  ss.forEach(x => { const l = parts[parts.length - 1]; if (l && (l + ' ' + x).length < 220) parts[parts.length - 1] = l + ' ' + x; else parts.push(x); });
  parts.forEach((p, k) => { const u = new SpeechSynthesisUtterance(SPOKEN.reduce((x, [r, s]) => x.replace(r, s), p)); if (voice) { u.voice = voice; u.lang = voice.lang; } u.rate = .96;
    if (k === parts.length - 1) u.onend = () => { if (token === my) done(); }; synth.speak(u); });
  return true;
}
function tStep(i) {
  if (i >= D.TOUR.length) return tStop(); if (i < 0) i = 0; ti = i; const s = D.TOUR[i], my = i;
  clearTimeout(tTimer); if (synth) synth.cancel(); stopFlow(true);
  if (S.tab !== s.tab) go(s.tab);
  $('#tN').textContent = `Step ${i + 1} of ${D.TOUR.length}`; $('#tT').textContent = s.title; $('#tB').textContent = s.say;
  $('#tour .pg span').style.width = ((i + 1) / D.TOUR.length * 100) + '%';
  // a step moves on only when the narration has finished AND (for flows) the packet has reached the end
  let spoken = !tPlaying, flowed = !s.flow;
  const advance = () => { if (spoken && flowed && tPlaying && ti === my) { clearTimeout(tTimer); tTimer = setTimeout(() => { if (ti === my && tPlaying) tStep(ti + 1); }, s.flow ? 2500 : 900); } };
  if (s.tab === 'map') {
    if (s.lens !== undefined || s.flow || s.node) setLens(!!s.lens);
    if (s.flow) { $('#flowSel').value = s.flow; setFlow(s.flow); if (tPlaying) setTimeout(() => { if (ti === my && tPlaying) playFlow(() => { flowed = true; advance(); }); }, 500); }
    else if (s.node) { resetMap(); showNode(s.node); }
    else if (!s.lens) { $('#flowSel').value = ''; resetMap(); }
  }
  if (!tPlaying) return;
  const words = s.say.split(/\s+/).length;
  if (!speak(s.say, () => { spoken = true; advance(); })) setTimeout(() => { spoken = true; advance(); }, Math.max(8000, words * 420));
  // safety net in case a speech engine never reports the end
  const hops = s.flow ? (D.FLOWS.find(f => f.id === s.flow).hops.length) : 0;
  tTimer = setTimeout(() => { if (ti === my && tPlaying) tStep(ti + 1); }, Math.max(words * 520 + 8000, hops * 3600 + 6000) + 15000);
}
function tStart() { $('#tour').style.display = 'block'; tPlaying = true; $('#tPl').textContent = '❚❚'; $('#tV').textContent = voiceOn ? '🔊' : '🔇'; tStep(0); }
function tStop() { tPlaying = false; clearTimeout(tTimer); if (synth) synth.cancel(); $('#tour').style.display = 'none'; ti = -1; }
$('#tourBtn').onclick = tStart; $('#tX').onclick = tStop; $('#tN2').onclick = () => tStep(ti + 1); $('#tP').onclick = () => tStep(ti - 1);
$('#tPl').onclick = () => { tPlaying = !tPlaying; $('#tPl').textContent = tPlaying ? '❚❚' : '▶'; if (tPlaying) tStep(ti); else { clearTimeout(tTimer); if (synth) synth.cancel(); stopFlow(true); } };
$('#tV').onclick = () => { voiceOn = !voiceOn; try { localStorage.setItem('p3a.voice', voiceOn ? 'on' : 'off'); } catch (e) { } $('#tV').textContent = voiceOn ? '🔊' : '🔇'; $('#vSel').style.display = voiceOn && voices.length ? '' : 'none'; if (!voiceOn && synth) synth.cancel(); };
$('#themeBtn').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('p3a.theme', t); } catch (e) { } go(S.tab); };
document.addEventListener('keydown', e => { if ($('#tour').style.display === 'block') { if (e.key === 'ArrowRight') tStep(ti + 1); if (e.key === 'ArrowLeft') tStep(ti - 1); if (e.key === 'Escape') tStop(); } });

tabs(); go('map');
})();
